<body>
    <script>
        //Find the Union of 2 Arrays - without duplicates
        let arr1 = [1,2,3,4,3];
        let arr2 = [3,4,5,6];

        function findUnion(a1, a2){
            //with Set method
            // let result = [...new Set([...a1, ...a2])];
            // return result;

            // without Set method
            let result = [];

            for(num of a1){
                if(!result.includes(num)){
                    result.push(num)
                }
            }

            for(num of a2){
                if(!result.includes(num)){
                    result.push(num)
                }
            }

            return result;
        }

        console.log(findUnion(arr1, arr2))
    </script>
