<body>
    <script>
        let arr = [1,0,2,3,0,4,5];
        function moveZero(a){
            let index = 0;
            for(num of a){
                if(num !== 0){
                    a[index] = num;
                    index++;
                    console.log(a)
                }
            }
            console.log(index)
            while(index < a.length){
                a[index] = 0;
                index++;
            }
            console.log(a)
        }

        console.log(moveZero(arr))
    </script>
