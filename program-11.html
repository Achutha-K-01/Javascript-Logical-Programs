<body>
    <script>
        //Find the all Duplicate elements in an Array

        let arr = [1, 2, 4, 1, 2, 6, 7, 8, 4];
        let countElements = {};
        let duplicateElements = [];

        function findDuplicates(arr){
        for(let num of arr){
           countElements[num] = (countElements[num] || 0) + 1;
            // if(countElements[num]){
            //     countElements[num]++;
            // }
            // else{
            // countElements[num] = 1;
            // }
        }
        for(let num in countElements){
            if(countElements[num] > 1){
                duplicateElements.push(Number(num));
            }
        }
        return duplicateElements;
        }
        console.log("Given Array: ", arr)
        console.log("Duplicate Elements: ",findDuplicates(arr))
    </script>
</body>
