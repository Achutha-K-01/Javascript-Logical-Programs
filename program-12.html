<!DOCTYPE html>

<body>
    <script>
        //Find the missing element from an Array containing numbers from 1 to n (One Element)

        let arr = [1,2,3,5,6];

        function missingElement(arr, n){
            
            // let arraySum = 0;
            // for(let i=1; i<= n; i++){
            //     arraySum +=  i;
            // }

            let arraySum = n * (n+1) / 2;
            console.log("Array sum: ", arraySum);

            let actualSum = 0;
            for(num of arr){
                actualSum += num;
            }
            console.log("Actual Sum: ",actualSum);
            return arraySum - actualSum;
        }
        console.log("Actual Array: ", arr);
        console.log(missingElement(arr,6));
        console.log("==============================")

        //Find the missing elements from an Array containing numbers from 1 to n (More Elements)

        let arr2 = [1,2,5,6];
        let missingElements = [];
        for(let i=1;i<=6;i++){
            if(arr2.indexOf(i) == -1){
                missingElements.push(i);
            }
        }

        console.log("Actual Array: ", arr2);
        console.log("Missing Elements: ",missingElements);
    </script>
</body>
