<body>
    <script>
        //FInd the Intersection of Two Arrays - Without Duplicates
        let arr1 = [1,2,3,4,3];
        let arr2 = [3,4,5,6];

        function findIntersection(arr1, arr2){
            let result = [];
            for(num of arr1){
                if(arr2.includes(num) && !result.includes(num)){
                    result.push(num)
                }
            }
            return result;
        }
        

        console.log(findIntersection(arr1, arr2));
    </script>
</body>
